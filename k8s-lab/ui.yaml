# The demo UI (stack/ui, Bun) on the NORMAL runtime: it reads the warped
# Postgres over the network and shows sim time next to real time.
#   kubectl port-forward -n timewarp svc/twui 8080:3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twui
  namespace: timewarp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twui
  template:
    metadata:
      labels:
        app: twui
    spec:
      containers:
        - name: twui
          image: twui:latest
          imagePullPolicy: Never   # loaded into the kind node with `kind load docker-image`
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres:5432/timewarp
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: twui
  namespace: timewarp
spec:
  selector:
    app: twui
  ports:
    - port: 3000
